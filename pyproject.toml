[project]
name = "ai-news"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ramkrishna Rathore", email = "tspy1947@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "celery[redis]>=5.7.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.162.4",
    "fastembed>=0.9.1",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "langchain-core>=1.6.7",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.3",
    "lxml>=6.1.3",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.4",
    "tiktoken>=0.14.0",
    "tokenizers>=0.23.2",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
ai-news = "ai_news:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.alembic]
script_location = "%(here)s/migrations"
file_template = "%%(rev)s_%%(slug)s"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
markers = ["integration: needs a running PostgreSQL with pgvector and pg_search (docker compose up -d)"]

[tool.coverage.run]
source = ["ai_news"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']
