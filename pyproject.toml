[project]
name = "ai-news"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ramkrishna Rathore", email = "tspy1947@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "defusedxml>=0.7.1",
    "fastembed>=0.9.1",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "langchain-core>=1.6.7",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.3",
    "lxml>=6.1.3",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
    "tokenizers>=0.23.2",
    "trafilatura>=2.3.1",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
ai-news = "ai_news:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.alembic]
script_location = "%(here)s/migrations"
file_template = "%%(rev)s_%%(slug)s"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
