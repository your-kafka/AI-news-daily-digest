name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --only-dev
      - run: uv run --no-sync ruff check src tests migrations
      - run: uv run --no-sync ruff format --check src tests migrations

  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: paradedb/paradedb:0.26.0-pg18
        env:
          POSTGRES_DB: lodestar
          POSTGRES_USER: lodestar
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lodestar -d lodestar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433
      POSTGRES_DB: lodestar
      POSTGRES_USER: lodestar
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Tests with coverage gate
        run: uv run --no-sync pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=87
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
